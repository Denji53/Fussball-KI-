<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Station 6 - Face Landmarker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Kamera- & Gesichtserkennung</h1>

    <!-- Button startet deaktiviert, bis die KI geladen ist -->
    <button id="startButton" disabled>Lade KI-Modell...</button>

    <div id="container" style="display: none;">
        <video id="cameraStream" autoplay playsinline></video>
        <div id="statusBox">Warte auf KI...</div>
    </div>

    <div style="margin: 10px; color: white;">
        <label for="thresholdSlider">Threshold (Puffer): <span id="thresholdValue">0.08</span></label><br>
        <input type="range" id="thresholdSlider" min="0.01" max="0.2" step="0.01" value="0.08" style="width: 200px;">
    </div>

    <!-- WICHTIG: type="module" ermöglicht den direkten Import der KI -->
    <script type="module" src="script.js?v=3"></script>


</body>

</html>
